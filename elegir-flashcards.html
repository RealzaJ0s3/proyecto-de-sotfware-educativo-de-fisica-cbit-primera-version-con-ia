<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegir Tema - Flashcards</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
            min-height: 100vh;
            color: #1e293b;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            color: white;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-back {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .nav-back:hover {
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .nav-icon { font-size: 1.3rem; }
        .nav-title { font-weight: 700; font-size: 1.1rem; }

        .elegir-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 24px 40px;
        }

        .elegir-header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .elegir-header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .elegir-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Selector de cantidad */
        .selector-cantidad {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .selector-cantidad label {
            display: block;
            font-size: 1rem;
            font-weight: 600;
            color: #065f46;
            margin-bottom: 12px;
        }

        .cantidad-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
        }

        .cantidad-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: white;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cantidad-btn:hover {
            transform: scale(1.1);
        }

        .cantidad-numero {
            font-size: 2rem;
            font-weight: 700;
            color: #065f46;
            min-width: 80px;
            text-align: center;
        }

        .rango-info {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .temas-grid {
            display: grid;
            gap: 16px;
        }

        .tema-card {
            background: white;
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 24px 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .tema-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            border-color: #22c55e;
        }

        .tema-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .tema-numero {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .tema-nombre {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1f2937;
        }

        .tema-descripcion {
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 4px;
        }

        .tema-flecha {
            font-size: 1.5rem;
            color: #22c55e;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tema-card:hover .tema-flecha {
            opacity: 1;
        }

        .loading-card {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: white;
            font-size: 1.1rem;
        }

        .error-card {
            background: #fef2f2;
            border: 2px solid #fecaca;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: #dc2626;
        }

        .estudiar-todo {
            margin-top: 24px;
            text-align: center;
        }

        .btn-todo {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px dashed rgba(255,255,255,0.4);
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-todo:hover {
            background: rgba(255,255,255,0.25);
            border-color: rgba(255,255,255,0.6);
        }

        @media (max-width: 600px) {
            .elegir-header h1 { font-size: 1.6rem; }
            .tema-card { padding: 18px 20px; }
            .tema-numero { width: 40px; height: 40px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/" class="nav-back">← Volver al inicio</a>
            <span class="nav-icon">⚛️</span>
            <span class="nav-title">Física CBIT</span>
        </div>
    </nav>

    <div class="elegir-container">
        <div class="elegir-header">
            <h1>🃏 ¿Qué quieres estudiar?</h1>
            <p>Elige un tema para practicar con flashcards</p>
        </div>

        <!-- SELECTOR DE CANTIDAD DE FLASHCARDS -->
        <div class="selector-cantidad">
            <label>📊 ¿Cuántas flashcards quieres estudiar?</label>
            <div class="cantidad-control">
                <button class="cantidad-btn" id="btn-menos" onclick="cambiarCantidad(-1)">−</button>
                <span class="cantidad-numero" id="cantidad-flashcards">10</span>
                <button class="cantidad-btn" id="btn-mas" onclick="cambiarCantidad(1)">+</button>
            </div>
            <div class="rango-info">Mínimo 5 | Máximo 20 flashcards por sesión</div>
        </div>

        <div class="temas-grid" id="temas-grid">
            <div class="loading-card">⏳ Cargando temas...</div>
        </div>

        <div class="estudiar-todo" id="estudiar-todo" style="display:none;">
            <a href="#" class="btn-todo" id="btn-estudiar-todo">🎯 Estudiar todos los temas</a>
        </div>
    </div>

    <script src="js/elegir-flashcards.js"></script>
    <script>
        // Función para cambiar cantidad de flashcards
        let cantidadFlashcards = 10;

        function cambiarCantidad(delta) {
            let nueva = cantidadFlashcards + delta;
            if (nueva >= 5 && nueva <= 20) {
                cantidadFlashcards = nueva;
                document.getElementById('cantidad-flashcards').textContent = cantidadFlashcards;
                // Guardar en localStorage
                localStorage.setItem('cantidad_flashcards', cantidadFlashcards);
            }
        }

        // Cargar cantidad guardada
        const guardada = localStorage.getItem('cantidad_flashcards');
        if (guardada && guardada >= 5 && guardada <= 20) {
            cantidadFlashcards = parseInt(guardada);
            document.getElementById('cantidad-flashcards').textContent = cantidadFlashcards;
        }

        // Modificar los enlaces para incluir la cantidad
        function actualizarEnlacesConCantidad() {
            document.querySelectorAll('.tema-card').forEach(card => {
                const hrefOriginal = card.getAttribute('href');
                if (hrefOriginal && hrefOriginal.includes('flashcards.html')) {
                    const separador = hrefOriginal.includes('?') ? '&' : '?';
                    const nuevoHref = hrefOriginal + separador + `cantidad=${cantidadFlashcards}`;
                    card.setAttribute('href', nuevoHref);
                }
            });
            
            const btnTodo = document.getElementById('btn-estudiar-todo');
            if (btnTodo) {
                btnTodo.href = `/flashcards.html?modo=todos&cantidad=${cantidadFlashcards}`;
            }
        }

        // Observar cambios en el grid
        const observer = new MutationObserver(function(mutations) {
            actualizarEnlacesConCantidad();
        });
        
        observer.observe(document.getElementById('temas-grid'), { childList: true, subtree: true });
    </script>
</body>
</html>
